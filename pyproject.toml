[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wts-in-landlab"
version = "0.1"
description = ""
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "David Litwin", email = "david.litwin@temple.edu" },
  { name = "Joanmarie Del Vecchio", email = "joanmarie@wm.edu"}
]
urls = { "Homepage" = "https://github.com/jmdelvecchio/wts-in-landlab/" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy",
  "landlab",
  "DupuitLEM",
  "tqdm",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*"]
